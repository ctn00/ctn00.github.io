<head>

<title>Bestie</title>
<style>
  :root { --bg: #fafaf9; --fg: #1c1917; --muted: #57534e; --link: #7c3aed; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1c1917; --fg: #f5f5f4; --muted: #a8a29e; --link: #c4b5fd; } }
  body { background: var(--bg); color: var(--fg); font: 17px/1.6 system-ui, sans-serif; margin: 0; padding: 48px 16px; }
  main { max-width: 640px; margin: 0 auto; }
  p { color: var(--muted); }
  a { color: var(--link); }
</style>
</head>
<body>
<main>
  <h1>Bestie</h1>
  <p>Bestie is a private, personal assistant built and used by one person for their own accounts. It helps its owner manage their own YouTube channel, email, calendar and files through a self-hosted automation server. It is not offered to the public and has no other users.</p>
  <p><a href="privacy.html">Privacy policy</a></p>
</main>
